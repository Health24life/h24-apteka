# Health24 Ruby styling
inherit_gem:
  health24_rubocop_config: rubocop.yml

AllCops:
  TargetRubyVersion: 4.0
  Exclude:
    - 'db/**/*'
    - 'bin/**/*'
    - 'vendor/**/*'

# ActiveAdmin's register DSL, RSpec example groups and Rails environment configs are long blocks by design.
Metrics/BlockLength:
  Exclude:
    - 'config/environments/**/*'
    - 'app/admin/**/*'
    - 'spec/**/*'

# annotaterb prints each check constraint and each index of a table on a single comment line.
Layout/LineLength:
  AllowedPatterns:
    - '\A#  \w+_check +\('
    - '\A#  index_\w+ +\('

# A value class is declared as `class X < Data.define(...)`: RBS describes it as a class, and Steep and the IDE check
# the methods of a class body, but see neither a `Data.define` block nor its constant as that class.
Style/DataInheritance:
  Enabled: false

# The rswag DSL of the request specs: `path`, an HTTP verb and `response` open example groups, `run_test!` is an example.
RSpec:
  Language:
    ExampleGroups:
      Regular:
        - path
        - get
        - post
        - put
        - patch
        - delete
        - response
    Examples:
      Regular:
        - run_test!

# An rswag spec nests describe, path, the HTTP verb and response by design.
RSpec/NestedGroups:
  Exclude:
    - 'spec/requests/**/*'

# rswag names a `let` after the header it fills.
RSpec/VariableName:
  AllowedPatterns:
    - '\AAuthorization\z'
    - '\AX-Cart-Token\z'

# A multi-line call reads top-down: chained calls are indented one step under the receiver instead of aligned to its
# first dot, and arguments that do not fit on one line each go on their own line, starting with the first.
Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/FirstMethodArgumentLineBreak:
  Enabled: true

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

# The same one-per-line rule for hash keys, array elements and method parameters.
Layout/FirstHashElementLineBreak:
  Enabled: true

Layout/MultilineHashKeyLineBreaks:
  Enabled: true

Layout/FirstArrayElementLineBreak:
  Enabled: true

Layout/MultilineArrayLineBreaks:
  Enabled: true

Layout/FirstMethodParameterLineBreak:
  Enabled: true

Layout/MultilineMethodParameterLineBreaks:
  Enabled: true

Rails/PluckId:
  Enabled: true

# A call, hash or array split one item per line is still one statement, so the length metrics count it as one line.
Metrics/MethodLength:
  CountAsOne: ['method_call', 'hash', 'array']

RSpec/ExampleLength:
  CountAsOne: ['method_call', 'hash', 'array']
