[tools]
ruby = "4.0.7"

[env]
_.file = ".env"
PORT = "2500"
APTEKA_POSTGRES_PORT = "2501"
APTEKA_REDIS_PORT = "2502"
REDIS_URL = "redis://localhost:2502/0"
SIDEKIQ_REDIS_URL = "redis://localhost:2502/1"
ENABLE_SWAGGER = "true"
SECRET_JWT_TOKEN = "local-jwt-secret-stub"
H24_CORE_REPLICA_DB_URL = "postgresql://user:123456@localhost:2401/h24_development"
H24_CORE_MASTER_DB_URL = "postgresql://user:123456@localhost:2400/h24_development"
H24_CORE_TEST_DB_URL = "postgresql://user:123456@localhost:2400/h24_test"
# Pharmapoint partner API. The key stays empty here: a run without it ends as failed instead of calling the partner.
# Real values go to mise.local.toml.
PHARMAPOINT_BASE_URL = "https://pharmapoint.ua/api/v1/online-drugstore"
PHARMAPOINT_API_KEY = ""
PHARMAPOINT_DOMAIN_NAME = "h24.ua"
PHARMAPOINT_RATE_LIMIT_PER_MINUTE = "60"
PHARMAPOINT_GOODS_GROUPS_PER_PAGE = "50"
# Points the drugstore directory is gathered around: the partner gives drugstores only near a point, never all of them.
# A JSON array of objects, each with all three keys:
#   latitude  - decimal degrees, -90..90 (Kyiv: 50.4501)
#   longitude - decimal degrees, -180..180 (Kyiv: 30.5234)
#   radius    - whole metres around the point (50 km: 50000)
# e.g. '[{"latitude": 50.4501, "longitude": 30.5234, "radius": 50000}, {"latitude": 49.8397, "longitude": 24.0297, "radius": 30000}]'
# An empty array leaves the drugstore run failing; a drugstore found by several points is saved once.
# See app/services/catalog/sync/README.md, "Пункти пошуку аптек".
PHARMAPOINT_DRUGSTORE_SEARCH_POINTS = '[{"latitude": 50.4501, "longitude": 30.5234, "radius": 50000}]'
# Live search of the partner: its share of the request limit, its own timeouts in seconds and the size of a page of goods
# groups. The timeouts are kept short, as a user waits for the answer.
PHARMAPOINT_SEARCH_RATE_LIMIT_PER_MINUTE = "40"
PHARMAPOINT_SEARCH_OPEN_TIMEOUT = "1"
PHARMAPOINT_SEARCH_READ_TIMEOUT = "3"
PHARMAPOINT_SEARCH_PER_PAGE = "20"
# Live prices and stock of drugstores for the cart and the pharmacy list: their share of the request limit and their own
# timeouts in seconds, short as a user waits for them.
PHARMAPOINT_CART_RATE_LIMIT_PER_MINUTE = "15"
PHARMAPOINT_CART_OPEN_TIMEOUT = "1"
PHARMAPOINT_CART_READ_TIMEOUT = "3"
# Days a guest's cart lives after its last change; a daily job removes older ones. An account's cart has no end.
APTEKA_GUEST_CART_TTL_DAYS = "7"
# When the daily job removes the abandoned guest carts; an empty value turns it off.
ORDERS_CART_CLEANUP_CRON = "40 4 * * *"
# Codes of the providers the search asks, comma-separated; an empty value turns the search off and leaves the sync on.
CATALOG_SEARCH_PROVIDERS = "pharmapoint"
# Queries one search request may hold, and seconds the whole request may take.
CATALOG_SEARCH_MAX_QUERIES = "1"
CATALOG_SEARCH_DEADLINE = "4"
# Where the search looks when the front sends no place: decimal degrees, and the radius in whole metres. A larger radius
# from the front than the maximum is refused.
APTEKA_SEARCH_DEFAULT_LATITUDE = "50.4501"
APTEKA_SEARCH_DEFAULT_LONGITUDE = "30.5234"
APTEKA_SEARCH_RADIUS = "25000"
APTEKA_SEARCH_MAX_RADIUS = "100000"
# Recurring runs, cron syntax. Goods groups stay off until a full import is agreed with the partner.
SYNC_CRON_DICTIONARIES = "0 3 * * *"
SYNC_CRON_CATEGORIES = "10 3 * * *"
SYNC_CRON_GOODS_GROUPS = ""
SYNC_CRON_DRUGSTORES = "30 3 * * *"
LOG_CLEANUP_CRON = "0 4 * * *"
SYNC_PULL_RUN_CLEANUP_CRON = "20 4 * * *"
# Seconds a goods group found by the live search waits in the cache for its on-demand fetch, and seconds a record
# whose fetch has failed for good is not queued again.
CATALOG_SYNC_STASH_TTL = "600"
CATALOG_SYNC_PULL_COOLDOWN = "900"
# Days the journal keeps the runs of on-demand fetches; the recurring runs are kept for good.
SYNC_PULL_RUN_RETENTION_DAYS = "90"
# Days a provider request log entry is kept, per category.
PHARMAPOINT_LOG_RETENTION_BOOKING_DAYS = "14"
PHARMAPOINT_LOG_RETENTION_SEARCH_DAYS = "1"
PHARMAPOINT_LOG_RETENTION_OFFERS_DAYS = "1"
PHARMAPOINT_LOG_RETENTION_REFRESH_DAYS = "7"
PHARMAPOINT_LOG_RETENTION_OTHER_DAYS = "7"

[tasks.server]
run = "bundle exec rails s"

[tasks.sidekiq]
run = "bundle exec sidekiq"

[tasks.rswag]
run = "RAILS_ENV=test bundle exec rails rswag"

[tasks.test]
run = "bundle exec rspec"

[tasks.docker-up]
run = "docker compose up -d"

[tasks.docker-down]
run = "docker compose down"

[tasks.rbs]
run = ["bundle exec rbs collection install", "rm -rf .rbs_rails", "bundle exec rails rbs_rails:all"]

[tasks.hooks]
description = "Install the git hooks (RuboCop and Steep before a commit) and sign their config and plugins"
run = ["bundle exec overcommit --install", "bundle exec overcommit --sign", "bundle exec overcommit --sign pre-commit"]

[tasks.typecheck]
run = ["bundle exec rbs collection install --frozen", "rm -rf .rbs_rails", "bundle exec rails rbs_rails:all", "bundle exec rbs -I sig -I .rbs_rails validate", "bundle exec steep check"]
