sources:
  - type: git
    name: ruby/gem_rbs_collection
    remote: https://github.com/ruby/gem_rbs_collection.git
    revision: main
    repo_dir: gems

path: .gem_rbs_collection

gems:
  # Its collection signatures answer `import` with void; own code reads the result, so a shim in sig/shims replaces them.
  - name: activerecord-import
    ignore: true
