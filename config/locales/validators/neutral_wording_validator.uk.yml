uk:
  errors:
    messages:
      not_neutral: 'містить недопустимі для ліків формулювання: %{words}'
  neutral_wording_validator:
    # Every form of "buy" and "price" a meta tag of a medicine must not use (advertising law); a word that only starts
    # the same, like «цінний», is fine. The lawyer extends the list here.
    forbidden_words:
    - купити
    - купіть
    - купуйте
    - купи
    - купую
    - куплю
    - купувати
    - купівля
    - купівлі
    - купівлю
    - купівлею
    - ціна
    - ціни
    - ціні
    - ціну
    - ціною
    - цін
    - цінам
    - цінами
    - цінах
