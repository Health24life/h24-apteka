en:
  api_controller:
    errors:
      unauthorized: The session is invalid or has expired. Sign in again.
      invalid_search_queries: Send queries as an array of one or more search queries, no more than allowed.
      invalid_search_text: The search text must hold 3 to 100 characters.
      invalid_search_page: The page must be a whole number from 1 to 50.
      invalid_search_location: Send the latitude and the longitude together, and the radius as a positive whole number of metres no larger than allowed.
      search_unavailable: The search is unavailable for now. Try again later.
      search_busy: The search is busy right now. Try again a little later.
      goods_not_found: The goods are not found or not available.
      invalid_location: Send the latitude and the longitude together, and the radius as a positive whole number of metres no larger than allowed.
      invalid_sort: Sort by price or by distance only.
      drugstores_unavailable: Prices in drugstores are unavailable for now. Try again later.
      drugstores_busy: The price service is busy now. Try again a little later.
      cart_not_found: The cart is not found or no longer available.
      cart_item_not_found: The cart has no such item.
      cart_drugstore_mismatch: The cart is already in another drugstore. Clear it to start in this one.
      drugstore_not_found: The drugstore is not found or not available.
      goods_not_in_drugstore: The drugstore of the cart does not have the goods.
      quantity_exceeds_stock: The drugstore does not have that many packs.
      invalid_quantity: The quantity must be a whole number of packs, from 1.
      cart_check_unavailable: The stock of the drugstore could not be checked. Try again later.
      cart_check_busy: The price service is busy now. Try again a little later.
