# Recurring jobs for sidekiq-cron, loaded when the Sidekiq server starts; the file is rendered with ERB first. A job whose
# cron is empty in the environment is left out, and sidekiq-cron then removes it from Redis too. The cron of each kind of
# import, with its default, comes from Catalog::Sync::Cron, which also decides whether an operator may start it by hand.

<% if (cron = Catalog::Sync::Cron.of('dictionaries')) %>
catalog_sync_dictionaries:
  cron: '<%= cron %>'
  class: 'Catalog::Sync::StartWorker'
  queue: default
  args: [ 'dictionaries' ]
<% end %>

<% if (cron = Catalog::Sync::Cron.of('categories')) %>
catalog_sync_categories:
  cron: '<%= cron %>'
  class: 'Catalog::Sync::StartWorker'
  queue: default
  args: [ 'categories' ]
<% end %>

<% if (cron = Catalog::Sync::Cron.of('goods_groups')) %>
catalog_sync_goods_groups:
  cron: '<%= cron %>'
  class: 'Catalog::Sync::StartWorker'
  queue: default
  args: [ 'goods_groups' ]
<% end %>

<% if (cron = Catalog::Sync::Cron.of('drugstores')) %>
catalog_sync_drugstores:
  cron: '<%= cron %>'
  class: 'Catalog::Sync::StartWorker'
  queue: default
  args: [ 'drugstores' ]
<% end %>

<% if (cron = ENV.fetch('LOG_CLEANUP_CRON', '0 4 * * *').strip.presence) %>
provider_request_log_cleanup:
  cron: '<%= cron %>'
  class: 'Pharmapoint::LogCleanupWorker'
  queue: default
<% end %>
