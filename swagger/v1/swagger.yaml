---
openapi: 3.0.1
info:
  title: Health24 Apteka API
  version: v1
paths:
  "/api/v1/favorites/drugstores":
    get:
      summary: Lists «Мої аптеки» of the signed-in user
      tags:
      - Favorites
      description: 'The drugstores the user keeps, the last added first, with the
        legal entity, its EDRPOU code and the working hours, as a drugstore is shown
        everywhere. A drugstore hidden or withdrawn later stays, with `available:
        false`. The provider is not asked.'
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Bearer token of the signed-in user
      responses:
        '200':
          description: the drugstores of the list, the last added first, the withdrawn
            one marked unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/favorite_drugstores_response"
        '401':
          description: 'unauthorized: no session, as the list belongs to an account'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/favorites/drugstores/{drugstore_id}":
    parameters:
    - name: drugstore_id
      in: path
      required: true
      schema:
        type: integer
    - name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Bearer token of the signed-in user
    put:
      summary: Puts a drugstore in «Мої аптеки»
      tags:
      - Favorites
      description: Adding a drugstore already in the list is no error and keeps its
        place, even in a full list. A list holds up to 100 drugstores.
      responses:
        '204':
          description: the drugstore is in the list, once, also when it was there
            already
        '404':
          description: 'drugstore_not_found: no such drugstore, or it is hidden or
            withdrawn'
        '422':
          description: 'favorites_limit_reached: the list holds the most it may; details.limit
            tells how many'
        '401':
          description: 'unauthorized: no session, as the list belongs to an account'
    delete:
      summary: Takes a drugstore out of «Мої аптеки»
      tags:
      - Favorites
      description: Also a drugstore the directory no longer shows. Taking out one
        that is not in the list is no error.
      responses:
        '204':
          description: the drugstore is out of the list, also when it was not there
        '401':
          description: 'unauthorized: no session, as the list belongs to an account'
  "/api/v1/favorites/goods":
    get:
      summary: Lists «Мої товари» of the signed-in user
      tags:
      - Favorites
      description: 'The SKU the user keeps, the last added first, with the static
        data of their cards and no prices: a price belongs to a drugstore. A SKU hidden
        or withdrawn later stays, with `available: false`. The provider is not asked.'
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Bearer token of the signed-in user
      responses:
        '200':
          description: the SKU of the list, the last added first, the hidden one marked
            unavailable
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/favorite_goods_response"
        '401':
          description: 'unauthorized: no session, as the list belongs to an account'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/favorites/goods/{goods_id}":
    parameters:
    - name: goods_id
      in: path
      required: true
      schema:
        type: integer
      description: SKU of the catalog
    - name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Bearer token of the signed-in user
    put:
      summary: Puts a SKU in «Мої товари»
      tags:
      - Favorites
      description: A release form, dosage and pack, not a trade name. Adding a SKU
        already in the list is no error and keeps its place, even in a full list.
        A list holds up to 100 SKU.
      responses:
        '204':
          description: the SKU is in the list, once, also when it was there already
        '404':
          description: 'goods_not_found: no such SKU, or it or its group is hidden
            or withdrawn'
        '422':
          description: 'favorites_limit_reached: the list holds the most it may; details.limit
            tells how many'
        '401':
          description: 'unauthorized: no session, as the list belongs to an account'
    delete:
      summary: Takes a SKU out of «Мої товари»
      tags:
      - Favorites
      description: Also a SKU the catalog no longer shows. Taking out a SKU that is
        not in the list is no error.
      responses:
        '204':
          description: the SKU is out of the list, also when it was not there
        '401':
          description: 'unauthorized: no session, as the list belongs to an account'
  "/api/v1/goods/{goods_id}/drugstores":
    post:
      summary: Lists the drugstores around that have a SKU, with its price there
      tags:
      - Drugstores
      description: 'The step that picks the drugstore of the cart: the drugstores
        around the place that have the SKU, each with the price in the drugstore and
        the whole packs it has, asked of the providers live and never cached. A provider
        that does not answer gives 503 rather than an empty list. Only drugstores
        of the directory are listed, with the legal entity, its EDRPOU code and the
        week schedule; one closed now is listed too, with the time it opens. The drugstores
        of the user''s «Мої аптеки» come first, marked `favorite`; `only_favorites`
        keeps only them and tells in `hidden_by_favorites` how many others have the
        SKU. A guest is served as a signed-in user, with no drugstore marked, and
        may not ask for `only_favorites`.'
      parameters:
      - name: goods_id
        in: path
        required: true
        schema:
          type: integer
        description: SKU of the catalog
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: Bearer token of a signed-in user; without it the request is served
          as a guest
      responses:
        '200':
          description: 'only «Мої аптеки»: none of them has the SKU, hidden_by_favorites
            tells how many others do'
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`no-store`: the answer is never cached"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/drugstores_response"
        '401':
          description: an expired or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: 'goods_not_found: no such SKU, or it or its group is hidden
            or withdrawn'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'invalid_only_favorites: only_favorites other than true or
            false'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'drugstores_busy: the request limit is used up; Retry-After
            tells when to try again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before asking again
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/drugstores_request"
  "/api/v1/orders/{order_token}/booking":
    parameters:
    - name: order_token
      in: path
      required: true
      schema:
        type: string
      description: Token of the cart
    - name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer token of a signed-in user; the cart of an account books
        only with it
    post:
      summary: Books the cart for pick-up
      tags:
      - Booking
      description: 'Sends the cart to the drugstore as a pick-up paid there, with
        no prepayment. The goods must be those of the cart, with the prices the user
        saw: prices and stock are confirmed live first, a higher price or a missing
        item stops the booking for a new consent, a lower price is taken. The consent
        to the processing of personal data is checked by the server. The same call
        tries again a booking whose sending failed, after looking for it at the partner
        so no second order is made. The order keeps the token of the cart, which is
        also the link it is shared by; the client data comes back only to the signed-in
        user of the order''s account.'
      parameters: []
      responses:
        '201':
          description: the share of the cart in the request limit is used up, the
            booking still goes
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/order_response"
        '403':
          description: 'turnstile_failed: the check of Cloudflare Turnstile did not
            pass'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: 'cart_not_found: no such cart, or an account''s cart without
            its session'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: booking_in_progress (another call books the cart), cart_changed
            or booking_prices_changed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'booking_not_allowed_in_drugstore: booking is not open in this
            drugstore yet'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '502':
          description: 'booking_submission_failed: the partner did not take the order;
            the same call tries again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'booking_check_unavailable, or booking_check_busy with Retry-After:
            prices could not be confirmed'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/booking_request"
        required: true
  "/api/v1/orders/{order_token}/items":
    parameters:
    - name: order_token
      in: path
      required: true
      schema:
        type: string
      description: Token of the cart
    post:
      summary: Puts a SKU in the cart
      tags:
      - Cart
      description: The SKU goes to the drugstore of the cart only, and one already
        in the cart adds to its item. It is checked live against what the drugstore
        has; nothing is saved when the check refuses or cannot be made.
      parameters: []
      responses:
        '200':
          description: the SKU went to the cart
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: cart_not_found, goods_not_found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: 'cart_drugstore_mismatch: the cart is in another drugstore;
            clear it to start in this one'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'invalid_quantity: not a whole number of packs from 1'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cart_item_request"
        required: true
  "/api/v1/orders/{order_token}/items/{id}":
    parameters:
    - name: order_token
      in: path
      required: true
      schema:
        type: string
      description: Token of the cart
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Sets the quantity of an item
      tags:
      - Cart
      description: Checked live against what the drugstore has, as when a SKU is put
        in.
      parameters: []
      responses:
        '200':
          description: the cart with the new quantity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: 'cart_item_not_found: no such item in the cart'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cart_quantity_request"
        required: true
    delete:
      summary: Takes an item out of the cart
      tags:
      - Cart
      description: The cart goes with its last item; read the cart again for the rest.
      responses:
        '204':
          description: the item is out
        '404':
          description: cart_item_not_found
  "/api/v1/orders":
    parameters:
    - name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer token of a signed-in user; the cart of an account opens
        only with it
    get:
      summary: Lists the bookings of the signed-in user's account
      tags:
      - Booking
      description: 'Newest first by the moment of booking, a page at a time, from
        what Health24 keeps of each booking: the partner is not asked, and the statuses
        are those the poll kept. A guest''s bookings have no history. `has_more` tells
        whether there is a next page. Open one booking by its `token`.'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Up to the configured maximum, 20 by default
      responses:
        '200':
          description: the bookings of the account, newest first
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/history_response"
        '401':
          description: 'unauthorized: no session — a guest has no history'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'invalid_page: a page below one or a page size above the maximum'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Makes the cart with its first SKU
      tags:
      - Cart
      description: A cart is an order in the cart state, bound to the drugstore its
        first SKU is put in. The answer gives `token`, the owner's key to the cart
        used in the path of every call on it. A signed-in user who has a cart already
        gets the SKU put in it. The SKU is checked live against what the drugstore
        has; nothing is saved when the check refuses or cannot be made.
      parameters: []
      responses:
        '201':
          description: the cart is made, with its token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '200':
          description: 'a signed-in user had a cart: the SKU went to it'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: goods_not_found or drugstore_not_found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: quantity_exceeds_stock, goods_not_in_drugstore or invalid_quantity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'cart_check_unavailable, or cart_check_busy with Retry-After:
            the stock could not be checked'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cart_item_request"
        required: true
  "/api/v1/orders/current":
    parameters:
    - name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer token of a signed-in user; the cart of an account opens
        only with it
    get:
      summary: Shows the signed-in user's cart
      tags:
      - Cart
      description: The way a signed-in user learns the token of the account's cart.
      responses:
        '200':
          description: the account's cart with live prices
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: 'cart_not_found: the account has no cart, or there is no session'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/orders/{token}":
    parameters:
    - name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer token of a signed-in user; the cart of an account opens
        only with it
    - name: token
      in: path
      required: true
      schema:
        type: string
      description: Token of the cart
    get:
      summary: Shows the cart with the live prices of its drugstore
      tags:
      - Cart
      description: 'Prices and stock are asked of the provider live and never stored:
        an item the drugstore has not now stays in the cart as not available. A provider
        that does not answer gives the cart without prices, not an error. What can
        no longer be sold is taken out and listed in `removed`; a cart whose drugstore
        or provider went is gone. A signed-in user who opens a guest''s cart takes
        it to the account when the account has none; carts are never merged.'
      responses:
        '200':
          description: 'the provider did not answer: the items without prices'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: 'cart_not_found: no such cart, an account''s cart without its
            session, or a cart that went'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: an expired or invalid session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    delete:
      summary: Clears the cart, or cancels the booking it became
      tags:
      - Cart
      description: 'A cart is removed with its items, so a cart can be started in
        another drugstore (204). A booking is cancelled at the drugstore and stays,
        with the status the partner gives after it (200), or with the status from
        before when the partner could not be asked again (202). Only the signed-in
        user of the booking''s account can cancel it: the token is also the link the
        booking is shared by. Only a booking the drugstore took, with a status that
        is not final, can be cancelled. The reason is optional and comes in the body.'
      parameters: []
      responses:
        '204':
          description: the cart is gone
        '200':
          description: the booking is cancelled; its status read again from the partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/order_response"
        '202':
          description: 'cancelled, but the partner did not answer for the status:
            the one from before is shown'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/order_response"
        '403':
          description: 'cancellation_needs_account: only the user of the booking''s
            account can cancel it'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: order_not_cancellable, or cancellation_refused when the drugstore
            did not accept it
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: cart_not_found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cancellation_request"
  "/api/v1/pillbox/plans":
    post:
      summary: Creates a plan of taking medicines of the signed-in user
      tags:
      - Pillbox
      description: 'A named plan of 1 to 10 medicines, each with its whole schedule
        and course: the client sends the same schedule in every item when the user
        wants one for all. The courses start on `start_date`, today in the time zone
        of the plan by default. A user keeps up to 5 active and paused plans. Invalid
        data is answered with the errors of every field at once and nothing is kept.'
      parameters:
      - name: Authorization
        in: header
        required: true
        schema:
          type: string
        description: Bearer token of the signed-in user
      responses:
        '201':
          description: the owner and the status come from the server, whatever the
            body says
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/pillbox_plan_response"
        '401':
          description: 'unauthorized: no session, as a plan belongs to an account'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'items[0].goods_id: no such SKU in the catalog'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/validation_errors"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/pillbox_plan_request"
        required: true
  "/api/v1/search":
    post:
      summary: Searches the providers live for goods by name
      tags:
      - Search
      description: 'Every query is searched live in the providers, never in the local
        catalog: a SKU only the catalog has is not listed, and a provider that does
        not answer gives 503 rather than an empty list. A row is a release form (SKU)
        without prices, stock or images; one the catalog does not show yet comes with
        `ready: false` and no address of its card. What is found is saved to the catalog
        in the background, so a later search lists it as ready. A page counts goods
        groups, not rows. Call it on submit, not on every key. The same for a guest
        and a signed-in user.'
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: Bearer token of a signed-in user; without it the request is served
          as a guest
      responses:
        '200':
          description: a signed-in user gets what a guest gets
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`no-store`: the answer is never cached"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/search_response"
        '401':
          description: an expired or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: a latitude without a longitude, or a radius out of bounds
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'search_busy: the request limit is used up; Retry-After tells
            when to try again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before searching again
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/search_request"
        required: true
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    search_request:
      type: object
      required:
      - queries
      properties:
        queries:
          type: array
          minItems: 1
          description: Search queries; this release takes exactly one
          items:
            type: object
            required:
            - text
            properties:
              text:
                type: string
                minLength: 3
                maxLength: 100
                description: Counted after squeezing spaces
              page:
                type: integer
                minimum: 1
                maximum: 50
                default: 1
                description: Page of goods groups
              location:
                type: object
                description: Where to look. Without the coordinates the configured
                  point is taken, without the radius the configured one; the coordinates
                  are rounded to about a kilometre
                properties:
                  latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                    description: With longitude only
                  longitude:
                    type: number
                    minimum: -180
                    maximum: 180
                    description: With latitude only
                  radius:
                    type: integer
                    minimum: 1
                    description: Metres, up to the configured maximum
    search_response:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          description: A result per query, in the order of the queries
          items:
            "$ref": "#/components/schemas/search_result"
    search_result:
      type: object
      required:
      - query
      - status
      - page
      - per_page
      - total_groups
      - has_more
      - goods
      properties:
        query:
          type: string
        status:
          type: string
          enum:
          - ok
          - partial
          - unavailable
          description: "`partial`: the list may lack goods, as some sources did not
            answer; `unavailable`: no source answered, while another query of the
            request was answered"
        page:
          type: integer
        per_page:
          type: integer
          description: Goods groups per page, not rows
        total_groups:
          type: integer
          description: Goods groups the providers have for the text
        has_more:
          type: boolean
        goods:
          type: array
          items:
            "$ref": "#/components/schemas/search_goods"
    search_goods:
      type: object
      description: 'A release form (SKU) with the static data of its card: no prices,
        stock or images, and nothing of the provider it came from'
      required:
      - ref
      - ready
      - id
      - slug
      - name
      - release_form
      - dosage
      - pack
      - is_recipe
      - is_strict_recipe
      - trade_name
      - producer
      - group
      properties:
        ref:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Opaque key of the row, the same in every search; tells nothing
            of where the goods come from
        ready:
          type: boolean
          description: 'Whether the catalog shows the SKU. A row that is not ready
            has no card yet: it cannot be opened or put in the cart, and a later search
            lists it as ready once it is saved'
        id:
          type: integer
          nullable: true
        slug:
          type: string
          nullable: true
          description: Address of the card; null when not ready
        name:
          type: string
          nullable: true
        release_form:
          type: string
          nullable: true
        dosage:
          type: string
          nullable: true
        pack:
          "$ref": "#/components/schemas/goods_pack"
        is_recipe:
          type: boolean
        is_strict_recipe:
          type: boolean
        trade_name:
          type: string
          nullable: true
        producer:
          "$ref": "#/components/schemas/goods_producer"
        group:
          type: object
          properties:
            ref:
              type: string
              pattern: "^[0-9a-f]{16}$"
              description: Opaque key of the goods group
            name:
              type: string
              nullable: true
    goods_pack:
      type: object
      properties:
        unit_name:
          type: string
          nullable: true
        quantity_in_pack:
          type: integer
          nullable: true
        quantity_unit_in_pack:
          type: integer
          nullable: true
        quantity_in_unit:
          type: integer
          nullable: true
    goods_producer:
      type: object
      properties:
        name:
          type: string
          nullable: true
        country_code:
          type: string
          nullable: true
          description: Upper case; the country is not named
    favorite_goods:
      type: object
      description: 'A SKU of «Мої товари» with the static data of its card: no prices
        or stock, as a price belongs to a drugstore'
      required:
      - id
      - slug
      - name
      - release_form
      - dosage
      - pack
      - is_recipe
      - is_strict_recipe
      - trade_name
      - producer
      - available
      - added_at
      properties:
        id:
          type: integer
        slug:
          type: string
          description: Address of the card
        name:
          type: string
          nullable: true
        release_form:
          type: string
          nullable: true
        dosage:
          type: string
          nullable: true
        pack:
          "$ref": "#/components/schemas/goods_pack"
        is_recipe:
          type: boolean
        is_strict_recipe:
          type: boolean
        trade_name:
          type: string
          nullable: true
        producer:
          "$ref": "#/components/schemas/goods_producer"
        available:
          type: boolean
          description: False while an operator hides the SKU or its group or the sync
            withdraws it; the record stays in the list
        added_at:
          type: string
          format: date-time
    favorite_goods_response:
      type: object
      required:
      - goods
      properties:
        goods:
          type: array
          description: 'The last added first, all of them: a list holds up to 100'
          items:
            "$ref": "#/components/schemas/favorite_goods"
    favorite_drugstore:
      allOf:
      - "$ref": "#/components/schemas/drugstore"
      - type: object
        required:
        - available
        - added_at
        properties:
          available:
            type: boolean
            description: False while an operator hides the drugstore or the sync withdraws
              it; the record stays in the list
          added_at:
            type: string
            format: date-time
    favorite_drugstores_response:
      type: object
      required:
      - drugstores
      properties:
        drugstores:
          type: array
          description: 'The last added first, all of them: a list holds up to 100'
          items:
            "$ref": "#/components/schemas/favorite_drugstore"
    drugstores_request:
      type: object
      properties:
        location:
          type: object
          description: 'Where to look, as in the search: without the coordinates the
            configured point is taken, without the radius the configured one; the
            coordinates are rounded to about a kilometre'
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
              description: With longitude only
            longitude:
              type: number
              minimum: -180
              maximum: 180
              description: With latitude only
            radius:
              type: integer
              minimum: 1
              description: Metres, up to the configured maximum
        sort:
          type: string
          enum:
          - price
          - distance
          default: price
          description: The cheapest or the nearest first
        work_with_reimbursement:
          type: boolean
          description: Only drugstores of the program «Доступні ліки»
        only_favorites:
          type: boolean
          default: false
          description: Only the drugstores of the user's «Мої аптеки», with the other
            filters and the sort; needs a signed-in user
    drugstores_response:
      type: object
      required:
      - drugstores
      properties:
        drugstores:
          type: array
          description: The drugstores of the user's «Мої аптеки» first, then the rest,
            each part in the sort
          items:
            "$ref": "#/components/schemas/nearby_drugstore"
        hidden_by_favorites:
          type: integer
          description: 'With `only_favorites` only: drugstores that have the SKU but
            are not in «Мої аптеки». An empty list with 0 means none around has it'
    drugstore:
      type: object
      description: A drugstore of the directory, with the legal entity, its EDRPOU
        code and the working hours
      required:
      - id
      - drugstore_legal_entity_name
      - drugstore_legal_entity_code
      - week_working_hours
      - work_with_reimbursement
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        brand:
          type: object
          nullable: true
          required:
          - name
          properties:
            name:
              type: string
        drugstore_legal_entity_name:
          type: string
          description: Full name of the legal entity
        drugstore_legal_entity_code:
          type: string
          pattern: "^[0-9]{8}([0-9]{2})?$"
          description: EDRPOU code of the legal entity
        address:
          type: object
          nullable: true
          required:
          - address
          - latitude
          - longitude
          properties:
            address:
              type: string
            latitude:
              type: number
            longitude:
              type: number
        phone:
          type: string
          nullable: true
        booking_available:
          type: boolean
          description: Whether booking is open in this drugstore
        week_working_hours:
          type: array
          description: Seven days from Monday, `HH:MM-HH:MM` or null for a day off;
            empty when unknown
          items:
            type: string
            nullable: true
        work_with_reimbursement:
          type: boolean
          description: Takes part in the program «Доступні ліки»
    nearby_drugstore:
      allOf:
      - "$ref": "#/components/schemas/drugstore"
      - type: object
        required:
        - price
        - available_quantity
        - favorite
        properties:
          favorite:
            type: boolean
            description: In the user's «Мої аптеки»; always false for a guest
          distance:
            type: integer
            nullable: true
            description: Metres from the place asked about
          open_now:
            type: boolean
            nullable: true
            description: Null when the provider did not tell
          opens_at:
            type: string
            format: date-time
            nullable: true
            description: The moment the drugstore next opens, today or on its next
              working day, in the time zone of Kyiv; null when it is open, closed
              within its hours, as for a break, or the hours are unknown
          price:
            type: string
            pattern: "^[0-9]+\\.[0-9]{2}$"
            description: Price of the SKU in the drugstore, hryvnias
          available_quantity:
            type: integer
            description: Whole packs of the SKU the drugstore has
    cart_item_request:
      type: object
      required:
      - goods_id
      - quantity
      properties:
        goods_id:
          type: integer
          description: SKU of the catalog
        drugstore_id:
          type: integer
          description: The drugstore picked from the list of drugstores with the price
            of the SKU, needed for the first SKU. When the SKU goes to a cart it may
            be left out; given, it must be the drugstore of the cart
        quantity:
          type: integer
          minimum: 1
          description: Whole packs, added to those already in the cart
    cart_quantity_request:
      type: object
      required:
      - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Whole packs
    cart_response:
      type: object
      required:
      - cart
      properties:
        cart:
          "$ref": "#/components/schemas/cart"
    cart:
      type: object
      required:
      - drugstore
      - prices_available
      - items
      - removed
      properties:
        token:
          type: string
          description: The owner's key to the cart, used in the path of every call
            on it
        drugstore:
          "$ref": "#/components/schemas/drugstore"
        prices_available:
          type: boolean
          description: 'False when the provider did not answer: the items come without
            prices'
        items:
          type: array
          items:
            type: object
            required:
            - id
            - quantity
            - available
            properties:
              id:
                type: integer
              goods:
                type: object
                nullable: true
                properties:
                  id:
                    type: integer
                  slug:
                    type: string
                  name:
                    type: string
              quantity:
                type: integer
              available:
                type: boolean
                description: Whether the drugstore has the whole quantity now; an
                  item it has not stays in the cart
              available_quantity:
                type: integer
                nullable: true
                description: Whole packs it has
              price:
                type: string
                nullable: true
                description: Hryvnias; only when available
              total:
                type: string
                nullable: true
                description: Hryvnias; only when available
        total:
          type: string
          nullable: true
          description: Hryvnias, of the available items; null without prices
        removed:
          type: array
          description: 'What was taken out on the way: a SKU hidden or withdrawn,
            alone or with its group'
          items:
            type: object
            properties:
              reason:
                type: string
                enum:
                - goods_hidden
                - goods_withdrawn
              goods:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
    booking_request:
      type: object
      required:
      - goods
      - customer
      - personal_data_consent
      - cf-turnstile-response
      properties:
        goods:
          type: array
          description: The goods of the cart, all of them, with the prices the user
            saw and agreed to
          items:
            type: object
            required:
            - goods_id
            - quantity
            - price
            properties:
              goods_id:
                type: integer
              quantity:
                type: integer
                minimum: 1
              price:
                type: string
                description: Hryvnias, as the cart showed it
        customer:
          type: object
          required:
          - first_name
          - phone_number
          properties:
            first_name:
              type: string
              maxLength: 100
            last_name:
              type: string
              maxLength: 100
            middle_name:
              type: string
              maxLength: 100
            phone_number:
              type: string
              description: Any Ukrainian form; kept as 380XXXXXXXXX
            email:
              type: string
        personal_data_consent:
          type: boolean
          enum:
          - true
          description: Checked by the server
        register_account:
          type: boolean
          description: The wish to register; no account is made yet
        cf-turnstile-response:
          type: string
          description: Token of the Cloudflare Turnstile widget
    order_response:
      type: object
      required:
      - order
      properties:
        order:
          "$ref": "#/components/schemas/order"
    order:
      type: object
      description: A sent order, as it was when it was sent
      required:
      - token
      - own_number
      - state
      - status
      - drugstore
      - items
      - total
      properties:
        token:
          type: string
          description: The one key, the same as the cart's; also the link the booking
            is shared by
        own_number:
          type: string
          description: Number of Health24
        customer_number:
          type: string
          nullable: true
          description: The partner's number for the client
        state:
          type: string
          enum:
          - submitted
          - submission_failed
        status:
          type: object
          properties:
            title:
              type: string
              nullable: true
              description: The partner's status, translated when known
            comment:
              type: string
              nullable: true
            known:
              type: boolean
            updated_at:
              type: string
              format: date-time
              nullable: true
        customer:
          type: object
          description: Only for the signed-in user of the order's account; not given
            to a guest or by the link
          properties:
            first_name:
              type: string
            last_name:
              type: string
              nullable: true
            middle_name:
              type: string
              nullable: true
            phone_number:
              type: string
            email:
              type: string
              nullable: true
        drugstore:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
        items:
          type: array
          items:
            type: object
            properties:
              goods_id:
                type: integer
                nullable: true
              name:
                type: string
              quantity:
                type: integer
              price:
                type: string
                nullable: true
              total:
                type: string
                nullable: true
        total:
          type: string
    history_response:
      type: object
      required:
      - orders
      - page
      - per_page
      - has_more
      properties:
        orders:
          type: array
          items:
            "$ref": "#/components/schemas/history_order"
        page:
          type: integer
        per_page:
          type: integer
        has_more:
          type: boolean
          description: Whether there is a next page
    history_order:
      type: object
      description: A booking of the account, without the client's data and the items
      required:
      - token
      - own_number
      - state
      - status
      - drugstore
      - items_count
      - total
      properties:
        token:
          type: string
        own_number:
          type: string
        customer_number:
          type: string
          nullable: true
        state:
          type: string
          enum:
          - submitted
          - submission_failed
        status:
          type: object
          properties:
            title:
              type: string
              nullable: true
            comment:
              type: string
              nullable: true
            known:
              type: boolean
            updated_at:
              type: string
              format: date-time
              nullable: true
        booked_at:
          type: string
          format: date-time
          description: The first attempt to book
        drugstore:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
        items_count:
          type: integer
        total:
          type: string
    cancellation_request:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
          description: Optional; without it the drugstore gets «Скасовано клієнтом»
    pillbox_plan_request:
      type: object
      required:
      - title
      - timezone
      - items
      properties:
        title:
          type: string
          maxLength: 50
          description: Not blank once the spaces around it are cut
        timezone:
          type: string
          example: Europe/Kyiv
          description: IANA time zone of the plan
        start_date:
          type: string
          format: date
          description: The day the courses start; today in the time zone of the plan
            by default, not earlier
        source_order_id:
          type: integer
          description: A booking of the user the client filled the plan from; the
            booking is not changed
        items:
          type: array
          minItems: 1
          maxItems: 10
          items:
            "$ref": "#/components/schemas/pillbox_plan_item_request"
    pillbox_plan_item_request:
      type: object
      description: A medicine with its whole schedule; the client keeps `source` and
        `goods_id` consistent
      required:
      - source
      - every_unit
      - times
      - course_mode
      properties:
        source:
          type: string
          enum:
          - order
          - catalog
          - manual
        goods_id:
          type: integer
          description: A SKU the catalog has, shown or not
        name:
          type: string
          maxLength: 255
        dosage:
          type: string
          maxLength: 100
        position:
          type: integer
          description: The place in the list of the request by default
        every_unit:
          type: string
          enum:
          - day
          - week
          - month
        every_n:
          type: integer
          minimum: 1
          maximum: 99
          default: 1
          description: Every N units
        weekdays:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: Weekly only, 0 is Sunday; none means the weekday of the start
            date
        times:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
          description: HH:MM in the time zone of the plan, no repeats
        reminder_mode:
          type: string
          enum:
          - once
          - until_marked
          default: once
        course_mode:
          type: string
          enum:
          - days
          - until
          - open
        course_days:
          type: integer
          minimum: 1
          maximum: 365
          description: For days only
        course_end_date:
          type: string
          format: date
          description: 'For until only: from the start date to 365 days after it'
    pillbox_plan_response:
      type: object
      required:
      - plan
      properties:
        plan:
          "$ref": "#/components/schemas/pillbox_plan"
    pillbox_plan:
      type: object
      required:
      - id
      - title
      - timezone
      - status
      - source_order_id
      - created_at
      - items
      properties:
        id:
          type: integer
        title:
          type: string
        timezone:
          type: string
        status:
          type: string
          enum:
          - active
          - paused
          - completed
        source_order_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        items:
          type: array
          description: By position
          items:
            "$ref": "#/components/schemas/pillbox_plan_item"
    pillbox_plan_item:
      type: object
      required:
      - id
      - source
      - goods_id
      - name
      - dosage
      - position
      - every_unit
      - every_n
      - weekdays
      - times
      - reminder_mode
      - course_mode
      - course_start_date
      - course_days
      - course_end_date
      properties:
        id:
          type: integer
        source:
          type: string
          enum:
          - order
          - catalog
          - manual
        goods_id:
          type: integer
          nullable: true
        name:
          type: string
          nullable: true
        dosage:
          type: string
          nullable: true
        position:
          type: integer
        every_unit:
          type: string
          enum:
          - day
          - week
          - month
        every_n:
          type: integer
        weekdays:
          type: array
          items:
            type: integer
        times:
          type: array
          items:
            type: string
        reminder_mode:
          type: string
          enum:
          - once
          - until_marked
        course_mode:
          type: string
          enum:
          - days
          - until
          - open
        course_start_date:
          type: string
          format: date
        course_days:
          type: integer
          nullable: true
          description: Null for an open course
        course_end_date:
          type: string
          format: date
          nullable: true
          description: Null for an open course
    validation_errors:
      type: object
      description: 'The errors of the model as Rails gives them: a field, or `items[<index>].<field>`
        for a medicine by its place in the request, or `base`, with its messages'
      additionalProperties:
        type: array
        items:
          type: string
    error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable machine code
            message:
              type: string
              description: Message in Ukrainian
            details:
              type: object
              description: 'What the front acts on, for some codes only: `available_quantity`
                for `quantity_exceeds_stock`, `reason` for a cart that went whole,
                `limit` for `favorites_limit_reached`'
  parameters:
    header_lang:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - uk
        - en
