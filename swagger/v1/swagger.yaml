---
openapi: 3.0.1
info:
  title: Health24 Apteka API
  version: v1
paths:
  "/api/v1/goods/{id}/drugstores":
    post:
      summary: Lists the drugstores around that have a SKU, with its price there
      tags:
      - Drugstores
      description: 'The step that picks the drugstore of the cart: the drugstores
        around the place that have the SKU, each with the price in the drugstore and
        the whole packs it has, asked of the providers live and never cached. A provider
        that does not answer gives 503 rather than an empty list. Only drugstores
        of the directory are listed, with the legal entity, its EDRPOU code and the
        week schedule; one closed now is listed too, with the time it opens. The same
        for a guest and a signed-in user.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: SKU of the catalog
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: Bearer token of a signed-in user; without it the request is served
          as a guest
      responses:
        '200':
          description: only the drugstores of the program «Доступні ліки», by distance
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`no-store`: the answer is never cached"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/drugstores_response"
        '401':
          description: an expired or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: 'goods_not_found: no such SKU, or it or its group is hidden
            or withdrawn'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'invalid_reimbursement: work_with_reimbursement other than
            true or false'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'drugstores_busy: the request limit is used up; Retry-After
            tells when to try again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before asking again
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/drugstores_request"
  "/api/v1/orders/{order_token}/booking":
    parameters:
    - name: order_token
      in: path
      required: true
      schema:
        type: string
      description: Token of the cart
    - name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer token of a signed-in user; the cart of an account books
        only with it
    post:
      summary: Books the cart for pick-up
      tags:
      - Booking
      description: 'Sends the cart to the drugstore as a pick-up paid there, with
        no prepayment. The goods must be those of the cart, with the prices the user
        saw: prices and stock are confirmed live first, a higher price or a missing
        item stops the booking for a new consent, a lower price is taken. The consent
        to the processing of personal data is checked by the server. The same call
        tries again a booking whose sending failed, after looking for it at the partner
        so no second order is made. The order keeps the token of the cart, which is
        also the link it is shared by; the client data comes back only to the signed-in
        user of the order''s account.'
      parameters: []
      responses:
        '201':
          description: the share of the cart in the request limit is used up, the
            booking still goes
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/order_response"
        '403':
          description: 'turnstile_failed: the check of Cloudflare Turnstile did not
            pass'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: 'cart_not_found: no such cart, or an account''s cart without
            its session'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: 'cart_changed: the goods sent are not those of the cart'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'booking_not_allowed_in_drugstore: booking is not open in this
            drugstore yet'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '502':
          description: 'booking_submission_failed: the partner did not take the order;
            the same call tries again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'booking_check_unavailable, or booking_check_busy with Retry-After:
            prices could not be confirmed'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/booking_request"
        required: true
  "/api/v1/orders/{order_token}/items":
    parameters:
    - name: order_token
      in: path
      required: true
      schema:
        type: string
      description: Token of the cart
    post:
      summary: Puts a SKU in the cart
      tags:
      - Cart
      description: The SKU goes to the drugstore of the cart only, and one already
        in the cart adds to its item. It is checked live against what the drugstore
        has; nothing is saved when the check refuses or cannot be made.
      parameters: []
      responses:
        '200':
          description: the SKU went to the cart
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: cart_not_found, goods_not_found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: 'cart_drugstore_mismatch: the cart is in another drugstore;
            clear it to start in this one'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'invalid_quantity: not a whole number of packs from 1'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cart_item_request"
        required: true
  "/api/v1/orders/{order_token}/items/{id}":
    parameters:
    - name: order_token
      in: path
      required: true
      schema:
        type: string
      description: Token of the cart
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Sets the quantity of an item
      tags:
      - Cart
      description: Checked live against what the drugstore has, as when a SKU is put
        in.
      parameters: []
      responses:
        '200':
          description: the cart with the new quantity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: 'cart_item_not_found: no such item in the cart'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cart_quantity_request"
        required: true
    delete:
      summary: Takes an item out of the cart
      tags:
      - Cart
      description: The cart goes with its last item; read the cart again for the rest.
      responses:
        '204':
          description: the item is out
        '404':
          description: cart_item_not_found
  "/api/v1/orders":
    parameters:
    - name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer token of a signed-in user; the cart of an account opens
        only with it
    get:
      summary: Lists the bookings of the signed-in user's account
      tags:
      - Booking
      description: 'Newest first by the moment of booking, a page at a time, from
        what Health24 keeps of each booking: the partner is not asked, and the statuses
        are those the poll kept. A guest''s bookings have no history. `has_more` tells
        whether there is a next page. Open one booking by its `token`.'
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Up to the configured maximum, 20 by default
      responses:
        '200':
          description: the bookings of the account, newest first
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/history_response"
        '401':
          description: 'unauthorized: no session — a guest has no history'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'invalid_page: a page below one or a page size above the maximum'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    post:
      summary: Makes the cart with its first SKU
      tags:
      - Cart
      description: A cart is an order in the cart state, bound to the drugstore its
        first SKU is put in. The answer gives `token`, the owner's key to the cart
        used in the path of every call on it. A signed-in user who has a cart already
        gets the SKU put in it. The SKU is checked live against what the drugstore
        has; nothing is saved when the check refuses or cannot be made.
      parameters: []
      responses:
        '201':
          description: the cart is made, with its token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '200':
          description: 'a signed-in user had a cart: the SKU went to it'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: goods_not_found or drugstore_not_found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: quantity_exceeds_stock, goods_not_in_drugstore or invalid_quantity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'cart_check_unavailable, or cart_check_busy with Retry-After:
            the stock could not be checked'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cart_item_request"
        required: true
  "/api/v1/orders/current":
    parameters:
    - name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer token of a signed-in user; the cart of an account opens
        only with it
    get:
      summary: Shows the signed-in user's cart
      tags:
      - Cart
      description: The way a signed-in user learns the token of the account's cart.
      responses:
        '200':
          description: the account's cart with live prices
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: 'cart_not_found: the account has no cart, or there is no session'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
  "/api/v1/orders/{token}":
    parameters:
    - name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer token of a signed-in user; the cart of an account opens
        only with it
    - name: token
      in: path
      required: true
      schema:
        type: string
      description: Token of the cart
    get:
      summary: Shows the cart with the live prices of its drugstore
      tags:
      - Cart
      description: 'Prices and stock are asked of the provider live and never stored:
        an item the drugstore has not now stays in the cart as not available. A provider
        that does not answer gives the cart without prices, not an error. What can
        no longer be sold is taken out and listed in `removed`; a cart whose drugstore
        or provider went is gone. A signed-in user who opens a guest''s cart takes
        it to the account when the account has none; carts are never merged.'
      responses:
        '200':
          description: 'the provider did not answer: the items without prices'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: 'cart_not_found: no such cart, an account''s cart without its
            session, or a cart that went'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: an expired or invalid session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    delete:
      summary: Clears the cart, or cancels the booking it became
      tags:
      - Cart
      description: 'A cart is removed with its items, so a cart can be started in
        another drugstore (204). A booking is cancelled at the drugstore and stays,
        with the status the partner gives after it (200). Only the signed-in user
        of the booking''s account can cancel it: the token is also the link the booking
        is shared by. Only a booking the drugstore took, with a status that is not
        final, can be cancelled. The reason is optional and comes in the body.'
      parameters: []
      responses:
        '204':
          description: the cart is gone
        '200':
          description: the booking is cancelled; its status read again from the partner
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/order_response"
        '403':
          description: 'cancellation_needs_account: only the user of the booking''s
            account can cancel it'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: order_not_cancellable, or cancellation_refused when the drugstore
            did not accept it
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: cart_not_found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cancellation_request"
  "/api/v1/search":
    post:
      summary: Searches the providers live for goods by name
      tags:
      - Search
      description: 'Every query is searched live in the providers, never in the local
        catalog: a SKU only the catalog has is not listed, and a provider that does
        not answer gives 503 rather than an empty list. A row is a release form (SKU)
        without prices, stock or images; one the catalog does not show yet comes with
        `ready: false` and no address of its card. What is found is saved to the catalog
        in the background, so a later search lists it as ready. A page counts goods
        groups, not rows. Call it on submit, not on every key. The same for a guest
        and a signed-in user.'
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: Bearer token of a signed-in user; without it the request is served
          as a guest
      responses:
        '200':
          description: a signed-in user gets what a guest gets
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`no-store`: the answer is never cached"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/search_response"
        '401':
          description: an expired or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: a latitude without a longitude, or a radius out of bounds
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'search_busy: the request limit is used up; Retry-After tells
            when to try again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before searching again
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/search_request"
        required: true
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    search_request:
      type: object
      required:
      - queries
      properties:
        queries:
          type: array
          minItems: 1
          description: Search queries; this release takes exactly one
          items:
            type: object
            required:
            - text
            properties:
              text:
                type: string
                minLength: 3
                maxLength: 100
                description: Counted after squeezing spaces
              page:
                type: integer
                minimum: 1
                maximum: 50
                default: 1
                description: Page of goods groups
              location:
                type: object
                description: Where to look. Without the coordinates the configured
                  point is taken, without the radius the configured one; the coordinates
                  are rounded to about a kilometre
                properties:
                  latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                    description: With longitude only
                  longitude:
                    type: number
                    minimum: -180
                    maximum: 180
                    description: With latitude only
                  radius:
                    type: integer
                    minimum: 1
                    description: Metres, up to the configured maximum
    search_response:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          description: A result per query, in the order of the queries
          items:
            "$ref": "#/components/schemas/search_result"
    search_result:
      type: object
      required:
      - query
      - status
      - page
      - per_page
      - total_groups
      - has_more
      - goods
      properties:
        query:
          type: string
        status:
          type: string
          enum:
          - ok
          - partial
          - unavailable
          description: "`partial`: the list may lack goods, as some sources did not
            answer; `unavailable`: no source answered, while another query of the
            request was answered"
        page:
          type: integer
        per_page:
          type: integer
          description: Goods groups per page, not rows
        total_groups:
          type: integer
          description: Goods groups the providers have for the text
        has_more:
          type: boolean
        goods:
          type: array
          items:
            "$ref": "#/components/schemas/search_goods"
    search_goods:
      type: object
      description: 'A release form (SKU) with the static data of its card: no prices,
        stock or images, and nothing of the provider it came from'
      required:
      - ref
      - ready
      - id
      - slug
      - name
      - release_form
      - dosage
      - pack
      - is_recipe
      - is_strict_recipe
      - trade_name
      - producer
      - group
      properties:
        ref:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Opaque key of the row, the same in every search; tells nothing
            of where the goods come from
        ready:
          type: boolean
          description: 'Whether the catalog shows the SKU. A row that is not ready
            has no card yet: it cannot be opened or put in the cart, and a later search
            lists it as ready once it is saved'
        id:
          type: integer
          nullable: true
        slug:
          type: string
          nullable: true
          description: Address of the card; null when not ready
        name:
          type: string
          nullable: true
        release_form:
          type: string
          nullable: true
        dosage:
          type: string
          nullable: true
        pack:
          type: object
          properties:
            unit_name:
              type: string
              nullable: true
            quantity_in_pack:
              type: integer
              nullable: true
            quantity_unit_in_pack:
              type: integer
              nullable: true
            quantity_in_unit:
              type: integer
              nullable: true
        is_recipe:
          type: boolean
        is_strict_recipe:
          type: boolean
        trade_name:
          type: string
          nullable: true
        producer:
          type: object
          properties:
            name:
              type: string
              nullable: true
            country_code:
              type: string
              nullable: true
              description: Upper case; the country is not named
        group:
          type: object
          properties:
            ref:
              type: string
              pattern: "^[0-9a-f]{16}$"
              description: Opaque key of the goods group
            name:
              type: string
              nullable: true
    drugstores_request:
      type: object
      properties:
        location:
          type: object
          description: 'Where to look, as in the search: without the coordinates the
            configured point is taken, without the radius the configured one; the
            coordinates are rounded to about a kilometre'
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
              description: With longitude only
            longitude:
              type: number
              minimum: -180
              maximum: 180
              description: With latitude only
            radius:
              type: integer
              minimum: 1
              description: Metres, up to the configured maximum
        sort:
          type: string
          enum:
          - price
          - distance
          default: price
          description: The cheapest or the nearest first
        work_with_reimbursement:
          type: boolean
          description: Only drugstores of the program «Доступні ліки»
    drugstores_response:
      type: object
      required:
      - drugstores
      properties:
        drugstores:
          type: array
          items:
            "$ref": "#/components/schemas/nearby_drugstore"
    drugstore:
      type: object
      description: A drugstore of the directory, with the legal entity, its EDRPOU
        code and the working hours
      required:
      - id
      - drugstore_legal_entity_name
      - drugstore_legal_entity_code
      - week_working_hours
      - work_with_reimbursement
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        brand:
          type: object
          nullable: true
          required:
          - name
          properties:
            name:
              type: string
        drugstore_legal_entity_name:
          type: string
          description: Full name of the legal entity
        drugstore_legal_entity_code:
          type: string
          pattern: "^[0-9]{8}([0-9]{2})?$"
          description: EDRPOU code of the legal entity
        address:
          type: object
          nullable: true
          required:
          - address
          - latitude
          - longitude
          properties:
            address:
              type: string
            latitude:
              type: number
            longitude:
              type: number
        phone:
          type: string
          nullable: true
        booking_available:
          type: boolean
          description: Whether booking is open in this drugstore
        week_working_hours:
          type: array
          description: Seven days from Monday, `HH:MM-HH:MM` or null for a day off;
            empty when unknown
          items:
            type: string
            nullable: true
        work_with_reimbursement:
          type: boolean
          description: Takes part in the program «Доступні ліки»
    nearby_drugstore:
      allOf:
      - "$ref": "#/components/schemas/drugstore"
      - type: object
        required:
        - price
        - available_quantity
        properties:
          distance:
            type: integer
            nullable: true
            description: Metres from the place asked about
          open_now:
            type: boolean
            nullable: true
            description: Null when the provider did not tell
          opens_at:
            type: string
            format: date-time
            nullable: true
            description: The moment the drugstore next opens, today or on its next
              working day, in the time zone of Kyiv; null when it is open, closed
              within its hours, as for a break, or the hours are unknown
          price:
            type: string
            pattern: "^[0-9]+\\.[0-9]{2}$"
            description: Price of the SKU in the drugstore, hryvnias
          available_quantity:
            type: integer
            description: Whole packs of the SKU the drugstore has
    cart_item_request:
      type: object
      required:
      - goods_id
      - drugstore_id
      - quantity
      properties:
        goods_id:
          type: integer
          description: SKU of the catalog
        drugstore_id:
          type: integer
          description: The drugstore picked from the list of drugstores with the price
            of the SKU; the drugstore of the cart when the SKU goes to a cart
        quantity:
          type: integer
          minimum: 1
          description: Whole packs, added to those already in the cart
    cart_quantity_request:
      type: object
      required:
      - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Whole packs
    cart_response:
      type: object
      required:
      - cart
      properties:
        cart:
          "$ref": "#/components/schemas/cart"
    cart:
      type: object
      required:
      - drugstore
      - prices_available
      - items
      - removed
      properties:
        token:
          type: string
          description: The owner's key to the cart, used in the path of every call
            on it
        drugstore:
          "$ref": "#/components/schemas/drugstore"
        prices_available:
          type: boolean
          description: 'False when the provider did not answer: the items come without
            prices'
        items:
          type: array
          items:
            type: object
            required:
            - id
            - quantity
            - available
            properties:
              id:
                type: integer
              goods:
                type: object
                nullable: true
                properties:
                  id:
                    type: integer
                  slug:
                    type: string
                  name:
                    type: string
              quantity:
                type: integer
              available:
                type: boolean
                description: Whether the drugstore has the whole quantity now; an
                  item it has not stays in the cart
              available_quantity:
                type: integer
                nullable: true
                description: Whole packs it has
              price:
                type: string
                nullable: true
                description: Hryvnias; only when available
              total:
                type: string
                nullable: true
                description: Hryvnias; only when available
        total:
          type: string
          nullable: true
          description: Hryvnias, of the available items; null without prices
        removed:
          type: array
          description: 'What was taken out on the way: a SKU hidden or withdrawn,
            alone or with its group'
          items:
            type: object
            properties:
              reason:
                type: string
                enum:
                - goods_hidden
                - goods_withdrawn
              goods:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
    booking_request:
      type: object
      required:
      - goods
      - customer
      - personal_data_consent
      - cf-turnstile-response
      properties:
        goods:
          type: array
          description: The goods of the cart, all of them, with the prices the user
            saw and agreed to
          items:
            type: object
            required:
            - goods_id
            - quantity
            - price
            properties:
              goods_id:
                type: integer
              quantity:
                type: integer
                minimum: 1
              price:
                type: string
                description: Hryvnias, as the cart showed it
        customer:
          type: object
          required:
          - first_name
          - phone_number
          properties:
            first_name:
              type: string
              maxLength: 100
            last_name:
              type: string
              maxLength: 100
            middle_name:
              type: string
              maxLength: 100
            phone_number:
              type: string
              description: Any Ukrainian form; kept as 380XXXXXXXXX
            email:
              type: string
        personal_data_consent:
          type: boolean
          enum:
          - true
          description: Checked by the server
        register_account:
          type: boolean
          description: The wish to register; no account is made yet
        cf-turnstile-response:
          type: string
          description: Token of the Cloudflare Turnstile widget
    order_response:
      type: object
      required:
      - order
      properties:
        order:
          "$ref": "#/components/schemas/order"
    order:
      type: object
      description: A sent order, as it was when it was sent
      required:
      - token
      - own_number
      - state
      - status
      - drugstore
      - items
      - total
      properties:
        token:
          type: string
          description: The one key, the same as the cart's; also the link the booking
            is shared by
        own_number:
          type: string
          description: Number of Health24
        customer_number:
          type: string
          nullable: true
          description: The partner's number for the client
        state:
          type: string
          enum:
          - submitted
          - submission_failed
        status:
          type: object
          properties:
            title:
              type: string
              nullable: true
              description: The partner's status, translated when known
            comment:
              type: string
              nullable: true
            known:
              type: boolean
            updated_at:
              type: string
              format: date-time
              nullable: true
        customer:
          type: object
          description: Only for the signed-in user of the order's account; not given
            to a guest or by the link
          properties:
            first_name:
              type: string
            last_name:
              type: string
              nullable: true
            middle_name:
              type: string
              nullable: true
            phone_number:
              type: string
            email:
              type: string
              nullable: true
        drugstore:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
        items:
          type: array
          items:
            type: object
            properties:
              goods_id:
                type: integer
                nullable: true
              name:
                type: string
              quantity:
                type: integer
              price:
                type: string
                nullable: true
              total:
                type: string
                nullable: true
        total:
          type: string
    history_response:
      type: object
      required:
      - orders
      - page
      - per_page
      - has_more
      properties:
        orders:
          type: array
          items:
            "$ref": "#/components/schemas/history_order"
        page:
          type: integer
        per_page:
          type: integer
        has_more:
          type: boolean
          description: Whether there is a next page
    history_order:
      type: object
      description: A booking of the account, without the client's data and the items
      required:
      - token
      - own_number
      - state
      - status
      - drugstore
      - items_count
      - total
      properties:
        token:
          type: string
        own_number:
          type: string
        customer_number:
          type: string
          nullable: true
        state:
          type: string
          enum:
          - submitted
          - submission_failed
        status:
          type: object
          properties:
            title:
              type: string
              nullable: true
            comment:
              type: string
              nullable: true
            known:
              type: boolean
            updated_at:
              type: string
              format: date-time
              nullable: true
        booked_at:
          type: string
          format: date-time
          description: The first attempt to book
        drugstore:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              nullable: true
            address:
              type: string
              nullable: true
        items_count:
          type: integer
        total:
          type: string
    cancellation_request:
      type: object
      properties:
        reason:
          type: string
          maxLength: 255
          description: Optional; without it the drugstore gets «Скасовано клієнтом»
    error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable machine code
            message:
              type: string
              description: Message in Ukrainian
            details:
              type: object
              description: 'What the front acts on, for some codes only: `available_quantity`
                for `quantity_exceeds_stock`, `reason` for a cart that went whole'
  parameters:
    header_lang:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - uk
        - en
