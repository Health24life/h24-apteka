---
openapi: 3.0.1
info:
  title: Health24 Apteka API
  version: v1
paths:
  "/api/v1/cart/items":
    parameters:
    - name: X-Cart-Token
      in: header
      required: false
      schema:
        type: string
      description: A guest's key to their cart; without a cart, the first item makes
        one and its token comes back. A signed-in user is known by the Authorization
        header
    post:
      summary: Puts a SKU in the cart
      tags:
      - Cart
      description: The first SKU makes the cart, bound to the drugstore it is put
        in; later ones go to that drugstore only, and one already in the cart adds
        to its item. Each is checked live against what the drugstore has; nothing
        is saved when the check refuses or cannot be made.
      parameters: []
      responses:
        '201':
          description: the first SKU made the cart; a guest gets its token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '200':
          description: the SKU went to the cart that was there
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: goods_not_found or drugstore_not_found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '409':
          description: 'cart_drugstore_mismatch: the cart is in another drugstore;
            clear it to start in this one'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'invalid_quantity: not a whole number of packs from 1'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'cart_check_unavailable, or cart_check_busy with Retry-After:
            the stock could not be checked'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cart_item_request"
        required: true
  "/api/v1/cart/items/{id}":
    parameters:
    - name: X-Cart-Token
      in: header
      required: false
      schema:
        type: string
      description: A guest's key to their cart; without a cart, the first item makes
        one and its token comes back. A signed-in user is known by the Authorization
        header
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Sets the quantity of an item
      tags:
      - Cart
      description: Checked live against what the drugstore has, as when a SKU is put
        in.
      parameters: []
      responses:
        '200':
          description: the cart with the new quantity
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: 'cart_item_not_found: no such item in the cart'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/cart_quantity_request"
        required: true
    delete:
      summary: Takes an item out of the cart
      tags:
      - Cart
      description: The cart goes with its last item; read the cart again for the rest.
      responses:
        '204':
          description: the item is out
        '404':
          description: cart_item_not_found
  "/api/v1/cart":
    parameters:
    - name: Authorization
      in: header
      required: false
      schema:
        type: string
      description: Bearer token of a signed-in user, whose account has the cart
    - name: X-Cart-Token
      in: header
      required: false
      schema:
        type: string
      description: A guest's key to their cart. Sent with a session right after signing
        in, it gives the guest's cart to the account when the account has none; carts
        are never merged
    get:
      summary: Shows the cart with the live prices of its drugstore
      tags:
      - Cart
      description: 'Prices and stock are asked of the provider live and never stored:
        an item the drugstore has not now stays in the cart as not available. A provider
        that does not answer gives the cart without prices, not an error. What can
        no longer be sold is taken out and listed in `removed`; a cart whose drugstore
        or provider went is gone.'
      responses:
        '200':
          description: a signed-in user's cart, with no token in the answer
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/cart_response"
        '404':
          description: 'cart_not_found: no cart, a token of no cart, or a cart whose
            drugstore or provider went'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '401':
          description: an expired or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
    delete:
      summary: Clears the cart for good
      tags:
      - Cart
      description: Removes the cart with its items, so a cart can be started in another
        drugstore.
      responses:
        '204':
          description: the cart is gone
        '404':
          description: cart_not_found
  "/api/v1/goods/{id}/drugstores":
    post:
      summary: Lists the drugstores around that have a SKU, with its price there
      tags:
      - Drugstores
      description: 'The step that picks the drugstore of the cart: the drugstores
        around the place that have the SKU, each with the price in the drugstore and
        the whole packs it has, asked of the providers live and never cached. A provider
        that does not answer gives 503 rather than an empty list. Only drugstores
        of the directory are listed, with the legal entity, its EDRPOU code and the
        week schedule; one closed now is listed too, with the time it opens. The same
        for a guest and a signed-in user.'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: SKU of the catalog
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: Bearer token of a signed-in user; without it the request is served
          as a guest
      responses:
        '200':
          description: only the drugstores of the program «Доступні ліки», by distance
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`no-store`: the answer is never cached"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/drugstores_response"
        '401':
          description: an expired or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '404':
          description: 'goods_not_found: no such SKU, or it or its group is hidden
            or withdrawn'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: 'invalid_sort: a sort other than price or distance'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'drugstores_busy: the request limit is used up; Retry-After
            tells when to try again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before asking again
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/drugstores_request"
  "/api/v1/search":
    post:
      summary: Searches the providers live for goods by name
      tags:
      - Search
      description: 'Every query is searched live in the providers, never in the local
        catalog: a SKU only the catalog has is not listed, and a provider that does
        not answer gives 503 rather than an empty list. A row is a release form (SKU)
        without prices, stock or images; one the catalog does not show yet comes with
        `ready: false` and no address of its card. What is found is saved to the catalog
        in the background, so a later search lists it as ready. A page counts goods
        groups, not rows. Call it on submit, not on every key. The same for a guest
        and a signed-in user.'
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: Bearer token of a signed-in user; without it the request is served
          as a guest
      responses:
        '200':
          description: a signed-in user gets what a guest gets
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`no-store`: the answer is never cached"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/search_response"
        '401':
          description: an expired or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: a latitude without a longitude, or a radius out of bounds
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'search_busy: the request limit is used up; Retry-After tells
            when to try again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before searching again
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/search_request"
        required: true
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    search_request:
      type: object
      required:
      - queries
      properties:
        queries:
          type: array
          minItems: 1
          description: Search queries; this release takes exactly one
          items:
            type: object
            required:
            - text
            properties:
              text:
                type: string
                minLength: 3
                maxLength: 100
                description: Counted after squeezing spaces
              page:
                type: integer
                minimum: 1
                maximum: 50
                default: 1
                description: Page of goods groups
              location:
                type: object
                description: Where to look. Without the coordinates the configured
                  point is taken, without the radius the configured one; the coordinates
                  are rounded to about a kilometre
                properties:
                  latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                    description: With longitude only
                  longitude:
                    type: number
                    minimum: -180
                    maximum: 180
                    description: With latitude only
                  radius:
                    type: integer
                    minimum: 1
                    description: Metres, up to the configured maximum
    search_response:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          description: A result per query, in the order of the queries
          items:
            "$ref": "#/components/schemas/search_result"
    search_result:
      type: object
      required:
      - query
      - status
      - page
      - per_page
      - total_groups
      - has_more
      - goods
      properties:
        query:
          type: string
        status:
          type: string
          enum:
          - ok
          - partial
          - unavailable
          description: "`partial`: the list may lack goods, as some sources did not
            answer; `unavailable`: no source answered, while another query of the
            request was answered"
        page:
          type: integer
        per_page:
          type: integer
          description: Goods groups per page, not rows
        total_groups:
          type: integer
          description: Goods groups the providers have for the text
        has_more:
          type: boolean
        goods:
          type: array
          items:
            "$ref": "#/components/schemas/search_goods"
    search_goods:
      type: object
      description: 'A release form (SKU) with the static data of its card: no prices,
        stock or images, and nothing of the provider it came from'
      required:
      - ref
      - ready
      - id
      - slug
      - name
      - release_form
      - dosage
      - pack
      - is_recipe
      - is_strict_recipe
      - trade_name
      - producer
      - group
      properties:
        ref:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: Opaque key of the row, the same in every search; tells nothing
            of where the goods come from
        ready:
          type: boolean
          description: 'Whether the catalog shows the SKU. A row that is not ready
            has no card yet: it cannot be opened or put in the cart, and a later search
            lists it as ready once it is saved'
        id:
          type: integer
          nullable: true
        slug:
          type: string
          nullable: true
          description: Address of the card; null when not ready
        name:
          type: string
          nullable: true
        release_form:
          type: string
          nullable: true
        dosage:
          type: string
          nullable: true
        pack:
          type: object
          properties:
            unit_name:
              type: string
              nullable: true
            quantity_in_pack:
              type: integer
              nullable: true
            quantity_unit_in_pack:
              type: integer
              nullable: true
            quantity_in_unit:
              type: integer
              nullable: true
        is_recipe:
          type: boolean
        is_strict_recipe:
          type: boolean
        trade_name:
          type: string
          nullable: true
        producer:
          type: object
          properties:
            name:
              type: string
              nullable: true
            country_code:
              type: string
              nullable: true
              description: Upper case; the country is not named
        group:
          type: object
          properties:
            ref:
              type: string
              pattern: "^[0-9a-f]{16}$"
              description: Opaque key of the goods group
            name:
              type: string
              nullable: true
    drugstores_request:
      type: object
      properties:
        location:
          type: object
          description: 'Where to look, as in the search: without the coordinates the
            configured point is taken, without the radius the configured one; the
            coordinates are rounded to about a kilometre'
          properties:
            latitude:
              type: number
              minimum: -90
              maximum: 90
              description: With longitude only
            longitude:
              type: number
              minimum: -180
              maximum: 180
              description: With latitude only
            radius:
              type: integer
              minimum: 1
              description: Metres, up to the configured maximum
        sort:
          type: string
          enum:
          - price
          - distance
          default: price
          description: The cheapest or the nearest first
        work_with_reimbursement:
          type: boolean
          description: Only drugstores of the program «Доступні ліки»
    drugstores_response:
      type: object
      required:
      - drugstores
      properties:
        drugstores:
          type: array
          items:
            "$ref": "#/components/schemas/nearby_drugstore"
    drugstore:
      type: object
      description: A drugstore of the directory, with the legal entity, its EDRPOU
        code and the working hours
      required:
      - id
      - legal_entity
      - week_working_hours
      - work_with_reimbursement
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        brand:
          type: object
          nullable: true
          properties:
            name:
              type: string
        legal_entity:
          type: object
          required:
          - name
          - code
          properties:
            name:
              type: string
              description: Full name of the legal entity
            code:
              type: string
              pattern: "^[0-9]{8}([0-9]{2})?$"
              description: EDRPOU code
        address:
          type: string
          nullable: true
        latitude:
          type: number
          nullable: true
        longitude:
          type: number
          nullable: true
        phone:
          type: string
          nullable: true
        week_working_hours:
          type: array
          description: Seven days from Monday, `HH:MM-HH:MM` or null for a day off;
            empty when unknown
          items:
            type: string
            nullable: true
        work_with_reimbursement:
          type: boolean
          description: Takes part in the program «Доступні ліки»
    nearby_drugstore:
      allOf:
      - "$ref": "#/components/schemas/drugstore"
      - type: object
        required:
        - goods
        properties:
          distance:
            type: integer
            nullable: true
            description: Metres from the place asked about
          open_now:
            type: boolean
            nullable: true
            description: Null when the provider did not tell
          opens_at:
            type: string
            nullable: true
            description: "`HH:MM` the drugstore next opens at, today or on its next
              working day; null when it is open or the hours are unknown"
          goods:
            type: object
            required:
            - price
            - available_quantity
            properties:
              price:
                type: string
                pattern: "^[0-9]+\\.[0-9]{2}$"
                description: Price in the drugstore, hryvnias
              available_quantity:
                type: integer
                description: Whole packs the drugstore has
    cart_item_request:
      type: object
      required:
      - goods_id
      - drugstore_id
      - quantity
      properties:
        goods_id:
          type: integer
          description: SKU of the catalog
        drugstore_id:
          type: integer
          description: The drugstore picked from the list of drugstores with the price
            of the SKU; the drugstore of the cart when it has items
        quantity:
          type: integer
          minimum: 1
          description: Whole packs, added to those already in the cart
    cart_quantity_request:
      type: object
      required:
      - quantity
      properties:
        quantity:
          type: integer
          minimum: 1
          description: Whole packs
    cart_response:
      type: object
      required:
      - cart
      properties:
        cart:
          "$ref": "#/components/schemas/cart"
    cart:
      type: object
      required:
      - drugstore
      - prices_available
      - items
      - removed
      properties:
        token:
          type: string
          description: A guest's secret key to the cart, sent back in `X-Cart-Token`;
            given to a guest only
        drugstore:
          "$ref": "#/components/schemas/drugstore"
        prices_available:
          type: boolean
          description: 'False when the provider did not answer: the items come without
            prices'
        items:
          type: array
          items:
            type: object
            required:
            - id
            - quantity
            - available
            properties:
              id:
                type: integer
              goods:
                type: object
                nullable: true
                properties:
                  id:
                    type: integer
                  slug:
                    type: string
                  name:
                    type: string
              quantity:
                type: integer
              available:
                type: boolean
                description: Whether the drugstore has the whole quantity now; an
                  item it has not stays in the cart
              available_quantity:
                type: integer
                nullable: true
                description: Whole packs it has
              price:
                type: string
                nullable: true
                description: Hryvnias; only when available
              total:
                type: string
                nullable: true
                description: Hryvnias; only when available
        total:
          type: string
          nullable: true
          description: Hryvnias, of the available items; null without prices
        removed:
          type: array
          description: 'What was taken out on the way: a SKU hidden or withdrawn,
            alone or with its group'
          items:
            type: object
            properties:
              reason:
                type: string
                enum:
                - goods_hidden
                - goods_withdrawn
              goods:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
    error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable machine code
            message:
              type: string
              description: Message in Ukrainian
            details:
              type: object
              description: 'What the front acts on, for some codes only: `available_quantity`
                for `quantity_exceeds_stock`, `reason` for a cart that went whole'
  parameters:
    header_lang:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - uk
        - en
