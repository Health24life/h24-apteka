---
openapi: 3.0.1
info:
  title: Health24 Apteka API
  version: v1
paths:
  "/api/v1/search":
    post:
      summary: Searches the providers live for goods by name
      tags:
      - Search
      description: 'Every query is searched live in the providers, never in the local
        catalog: a SKU only the catalog has is not listed, and a provider that does
        not answer gives 503 rather than an empty list. A row is a release form (SKU)
        without prices, stock or images; one the catalog does not show yet comes with
        `ready: false` and no address of its card. What is found is saved to the catalog
        in the background, so a later search lists it as ready. A page counts goods
        groups, not rows. Call it on submit, not on every key. The same for a guest
        and a signed-in user.'
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: Bearer token of a signed-in user; without it the request is served
          as a guest
      responses:
        '200':
          description: a signed-in user gets what a guest gets
          headers:
            Cache-Control:
              schema:
                type: string
              description: "`no-store`: the answer is never cached"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/search_response"
        '401':
          description: an expired or invalid token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '422':
          description: a latitude without a longitude, or a radius out of bounds
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
        '503':
          description: 'search_busy: the request limit is used up; Retry-After tells
            when to try again'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/error"
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before searching again
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/search_request"
        required: true
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    search_request:
      type: object
      required:
      - queries
      properties:
        queries:
          type: array
          minItems: 1
          description: Search queries; this release takes exactly one
          items:
            type: object
            required:
            - text
            properties:
              text:
                type: string
                minLength: 3
                maxLength: 100
                description: Counted after squeezing spaces
              page:
                type: integer
                minimum: 1
                maximum: 50
                default: 1
                description: Page of goods groups
              location:
                type: object
                description: Where to look. Without the coordinates the configured
                  point is taken, without the radius the configured one; the coordinates
                  are rounded to about a kilometre
                properties:
                  latitude:
                    type: number
                    minimum: -90
                    maximum: 90
                    description: With longitude only
                  longitude:
                    type: number
                    minimum: -180
                    maximum: 180
                    description: With latitude only
                  radius:
                    type: integer
                    minimum: 1
                    description: Metres, up to the configured maximum
    search_response:
      type: object
      required:
      - results
      properties:
        results:
          type: array
          description: A result per query, in the order of the queries
          items:
            "$ref": "#/components/schemas/search_result"
    search_result:
      type: object
      required:
      - query
      - status
      - unavailable_providers
      - page
      - per_page
      - total_groups
      - has_more
      - goods
      properties:
        query:
          type: string
        status:
          type: string
          enum:
          - ok
          - partial
          - unavailable
          description: "`partial`: some providers did not answer; `unavailable`: none
            did, while another query of the request was answered"
        unavailable_providers:
          type: array
          items:
            type: string
          description: Codes of providers
        page:
          type: integer
        per_page:
          type: integer
          description: Goods groups per page, not rows
        total_groups:
          type: integer
          description: Goods groups the providers have for the text
        has_more:
          type: boolean
        goods:
          type: array
          items:
            "$ref": "#/components/schemas/search_goods"
    search_goods:
      type: object
      description: 'A release form (SKU) with the static data of its card: no prices,
        stock or images'
      required:
      - ref
      - provider
      - ready
      - id
      - slug
      - name
      - release_form
      - dosage
      - pack
      - is_recipe
      - is_strict_recipe
      - trade_name
      - producer
      - group
      properties:
        ref:
          type: string
          description: Stable key of the row; not to be taken apart
        provider:
          type: string
        ready:
          type: boolean
          description: 'Whether the catalog shows the SKU. A row that is not ready
            has no card yet: it cannot be opened or put in the cart, and a later search
            lists it as ready once it is saved'
        id:
          type: integer
          nullable: true
        slug:
          type: string
          nullable: true
          description: Address of the card; null when not ready
        name:
          type: string
          nullable: true
        release_form:
          type: string
          nullable: true
        dosage:
          type: string
          nullable: true
        pack:
          type: object
          properties:
            unit_name:
              type: string
              nullable: true
            quantity_in_pack:
              type: integer
              nullable: true
            quantity_unit_in_pack:
              type: integer
              nullable: true
            quantity_in_unit:
              type: integer
              nullable: true
        is_recipe:
          type: boolean
        is_strict_recipe:
          type: boolean
        trade_name:
          type: string
          nullable: true
        producer:
          type: object
          properties:
            name:
              type: string
              nullable: true
            country_code:
              type: string
              nullable: true
              description: Upper case; the country is not named
        group:
          type: object
          properties:
            ref:
              type: string
            name:
              type: string
              nullable: true
    error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              description: Stable machine code
            message:
              type: string
              description: Message in Ukrainian
  parameters:
    header_lang:
      name: Accept-Language
      in: header
      schema:
        type: string
        enum:
        - uk
        - en
